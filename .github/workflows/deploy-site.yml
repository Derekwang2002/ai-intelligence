name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'events/**'
      - 'daily/**'
      - 'trends/**'
      - 'index/**'
      - 'state.json'
      - 'projects/**'
      - 'sources/**'
      - 'topics/**'
      - 'briefings/**'
      - 'reviews/**'
      - 'config/**'
      - 'scripts/**'
      - 'TASK.md'
      - 'AGENTS.md'
      - 'site/**'
      - '.github/workflows/deploy-site.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build site
        working-directory: site
        env:
          # Project Pages serve under /<repo-name>/
          ASTRO_BASE: /${{ github.event.repository.name }}
        run: npm run check

      - name: Install browser test runtime
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Verify reading flows
        working-directory: site
        run: npm run test:browser

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6
        with:
          # Pages 站点未启用时自动开启（Source = GitHub Actions）
          enablement: true

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
